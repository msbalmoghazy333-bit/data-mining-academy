# Alembic configuration for Data Mining Academy.
#
# NOTE: the database URL is NOT set here on purpose. `alembic/env.py` reads it
# from `app.core.config.Settings` (i.e. from `.env`), so there is exactly one
# source of truth for where the database lives.
#
# Commands:
#   alembic revision --autogenerate -m "message"   # create a migration
#   alembic upgrade head                           # apply migrations
#   alembic downgrade head -1                      # roll back one step

[alembic]
script_location = alembic
prepend_sys_path = .
# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
